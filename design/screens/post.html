      <h1>How the globe puts labels on a sphere</h1>
      <p class="dek">A flat map can print a name once and forget it. On a globe the same name has to
        bend with the surface, give way to its neighbours and stay readable while everything turns.</p>
      <div class="byline">
        <span class="meta">dartvadius · Oct 31, 2026 · 7 min read</span>
      </div>
    </div>

    <div class="wide"><img src="img/political.webp" alt=""></div>

    <div class="post prose">
      <p>Terrella draws tens of thousands of names: countries, cities, rivers, ranges, seas. At any
        moment only a small share of them fit. Which ones, where, and in what shape — that is most of
        what makes a map look like a map rather than a scatter of words.</p>

      <h2>Names that follow the land</h2>
      <p>A river name is not placed at a point. It runs along the river, letter by letter, and each
        letter is turned to match the bend under it. The same goes for mountain ranges and long seas.
        <a href="#">Imhof's rules</a> for lettering were written for paper, and most of them hold on a sphere.</p>

      <figure>
        <img src="img/historical.webp" alt="">
        <figcaption>Names of states set along their territory rather than at one point; the spacing
          opens up as the state grows.</figcaption>
      </figure>

      <h2>Who wins a collision</h2>
      <p>Two names that overlap cannot both stay. The rule is a ranking, not a timer: a capital beats a
        town, a long river beats a short one, and a name that is already on screen keeps its place a
        little longer so the map does not flicker as you pan.</p>

      <figure>
        <div class="pair">
          <div><img src="img/political.webp" alt=""><div class="lbl">Before</div></div>
          <div><img src="img/historical.webp" alt=""><div class="lbl">After</div></div>
        </div>
        <figcaption>The same view before and after the collision ranking.</figcaption>
      </figure>

      <figure class="clip">
        <img src="img/stars.webp" alt="">
        <figcaption>Turning the star globe: constellation names stay upright as the sky rotates.</figcaption>
      </figure>

      <div class="note"><b>Fonts:</b> physical names are set in Alegreya, cultural ones in Alegreya Sans —
        both under the SIL Open Font License.</div>

      <p>The full write-up of the rules, with the sources they come from, is in the project notes.
