<script>
for (const f of document.querySelectorAll('[data-tpl]')) {
  f.append(document.getElementById(f.dataset.tpl).content.cloneNode(true));
  const page = f.dataset.page;
  for (const el of f.querySelectorAll('[data-only]')) if (el.dataset.only !== page) el.remove();
  for (const el of f.querySelectorAll('.item')) {
    const keep = page === 'tag' ? el.dataset.tags.split(' ').includes('cartography') : el.dataset.p === page;
    if (!keep) el.remove();
  }
  const pager = f.querySelector('.pager');
  if (page === 'tag') { pager.remove(); continue; }
  pager.querySelector(`[data-n="${page}"]`).classList.add('on');
  if (page === '1') pager.querySelector('[data-pg="prev"]').classList.add('dead');
}
</script>
